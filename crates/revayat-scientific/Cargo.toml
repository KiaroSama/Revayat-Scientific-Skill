[package]
name = "revayat-scientific"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native document integrity and scientific Persian translation tools"
publish = false
default-run = "revayat-scientific"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
flate2 = "1.1"
cssparser = "0.35"
scraper = "0.29"
unicode-bidi-mirroring = "0.4"
getrandom = "0.3"
regex = "1.11"
registry-authority = { path = "../../tests/security/windows/registry-authority" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde-saphyr = "2.1.1"
sha2 = "0.10"
tempfile = "3.20"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
markup5ever = "0.40"
url = "2.5"
base64 = "0.22"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff"] }
kamadak-exif = "0.6.2"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

lopdf = "0.46"
png = "0.18"
gif = "0.13"
tiff = "0.10"
read-fonts = "0.47"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
harfrust = "0.16"
unicode-bidi = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Opc", "Win32_Storage_Vhd", "Win32_System_Com", "Win32_System_IO", "Win32_System_Ioctl"] }

[lints]
workspace = true
