name: CI
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Full base commit SHA for manual dependency and identity review
        required: true
        type: string
      prepare_artifacts:
        description: Generate lockfile and notices only; does not validate or accept the migration
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  prepare-artifacts:
    if: ${{ inputs.prepare_artifacts }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: '1.99.1'
          components: rust-docs
          cache: false
      - name: Resolve workspace member changes while retaining existing dependency locks
        timeout-minutes: 5
        run: cargo update --workspace
      - name: Require the generated lockfile to be stable
        timeout-minutes: 5
        run: cargo update --workspace --locked
      - name: Fetch the exact complete locked dependency graph
        timeout-minutes: 10
        run: cargo fetch --locked
      - name: Build only the notice generator and its owned process companion
        timeout-minutes: 20
        run: cargo build --locked -p revayat-scientific --bin license-notices --bin revayat-process-owner
      - name: Generate complete notices from the resolved exact graph
        timeout-minutes: 5
        run: cargo run --locked --bin license-notices -- --root .
      - name: Require byte-exact deterministic notices
        timeout-minutes: 5
        run: cargo run --locked --bin license-notices -- --root . --check
      - name: Require unchanged resolution after notice generation
        timeout-minutes: 5
        run: cargo update --workspace --locked
      - name: Preserve only generated lockfile and complete notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: prepared-lock-notices-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            Cargo.lock
            skills/revayat-scientific/references/third-party-licenses.txt
  status-pending:
    if: ${{ !inputs.prepare_artifacts }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Publish pending job statuses
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: cargo run --locked --bin revayat-scientific -- ci-status pending
  security:
    if: ${{ !inputs.prepare_artifacts }}
    uses: ./.github/workflows/security-ci.yml
  codeql:
    if: ${{ !inputs.prepare_artifacts }}
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
  dependency-review:
    if: ${{ !inputs.prepare_artifacts }}
    uses: ./.github/workflows/dependency-review.yml
    with:
      base_ref: ${{ github.event.pull_request.base.sha || inputs.base_ref || github.event.before }}
  portable:
    if: ${{ !inputs.prepare_artifacts }}
    name: portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Build every native target
        run: cargo build --locked --workspace --all-targets
      - name: Run all portable public contracts
        run: cargo test --locked --workspace --all-targets -- --test-threads=1
      - name: Prepare licensed fonts for native Windows renderer
        if: runner.os == 'Windows'
        run: cargo run --locked --bin revayat-scientific -- fonts fonts
      - name: Execute native Windows rendering and failed-delivery preservation
        if: runner.os == 'Windows'
        run: cargo test --locked -p revayat-scientific --test runtime_build_integration test_windows_build_preserves_destination_on_failure -- --ignored --test-threads=1
      - name: Audit all public, upstream and standalone security scenarios
        run: cargo run --locked --bin revayat-scientific -- migration-check
      - name: Validate UTF-8, metadata, local links and native skill layout
        run: cargo run --locked --bin revayat-scientific -- validate
      - name: Build release executable on every operating system
        if: ${{ always() }}
        run: cargo build --locked --release --workspace --bins
      - name: Package the complete native installed workflow
        run: cargo run --locked --release --bin revayat-scientific -- package
      - name: Preserve native release and complete skill archive
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: revayat-scientific-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/revayat-scientific
            target/release/revayat-scientific.exe
            target/release/registry-authority.exe
            dist/revayat-scientific.skill
  scientific:
    if: ${{ !inputs.prepare_artifacts }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCIENTIFIC_REQUIRE_TEX_BOUNDARY: '1'
      SCIENTIFIC_REQUIRE_BUILD_GUARD: '1'
      SCIENTIFIC_REQUIRE_BROWSER: '1'
      SCIENTIFIC_REQUIRE_OCR: '1'
      SCIENTIFIC_REQUIRE_SANDBOX: '1'
      SCIENTIFIC_REQUIRE_DOCX_RENDER: '1'
      SCIENTIFIC_REQUIRE_HTML_CONTEXT: '1'
      SCIENTIFIC_RENDER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Install bounded native document toolchain
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils texlive-xetex texlive-lang-arabic texlive-latex-extra fonts-dejavu-core fonts-vazirmatn libreoffice-writer tesseract-ocr tesseract-ocr-eng tesseract-ocr-fas
      - name: Build native document tools
        run: cargo build --locked --workspace --all-targets
      - name: Install required native workflow regression checker
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prepare licensed Persian font pair
        run: cargo run --locked --bin revayat-scientific -- fonts skills/revayat-scientific/assets/fonts
      - name: Build isolated Rust-supervised TeX toolchain
        timeout-minutes: 20
        run: docker build -f skills/revayat-scientific/assets/Dockerfile.tex -t revayat-scientific-tex:1 .
      - name: Execute every required rendering, OCR, source and sandbox regression
        timeout-minutes: 20
        env:
          SCIENTIFIC_EVIDENCE_DIR: ${{ runner.temp }}/scientific-evidence
        run: cargo test --locked -p revayat-scientific --tests -- --include-ignored --test-threads=1
      - name: Verify complete migration inventory with scientific tests registered
        run: cargo run --locked --bin revayat-scientific -- migration-check
      - name: Preserve rendered verification samples
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scientific-render
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/scientific-evidence
            .scratch/scientific-*
  quality:
    if: ${{ !inputs.prepare_artifacts }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rust-docs
      - name: Check introduced commit identities
        env:
          IDENTITY_BASE: ${{ github.event.pull_request.base.sha || inputs.base_ref || github.event.before }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          review_base="$IDENTITY_BASE"
          if [ "$review_base" = 0000000000000000000000000000000000000000 ]; then
            review_base="$(git merge-base -- "origin/$DEFAULT_BRANCH" "$HEAD_REF")"
          fi
          cargo run --locked --bin revayat-scientific -- check-sha "$review_base"
          cargo run --locked --bin revayat-scientific -- check-commit-identity --base "$review_base" --head "$HEAD_REF"
      - name: Native syntax and lint checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Fetch the complete locked cross-platform dependency graph
        run: cargo fetch --locked
      - name: Verify complete third-party license and copyright notices
        run: cargo run --locked --bin license-notices -- --check
      - name: Cache pinned native quality tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/zizmor
          key: native-quality-${{ runner.os }}-audit0.22.2-zizmor1.32.0-actionlint1.7.12
      - name: Install pinned dependency and workflow security scanners
        run: |
          test -x "$HOME/.cargo/bin/cargo-audit" || cargo install --locked cargo-audit --version 0.22.2
          test -x "$HOME/.cargo/bin/zizmor" || cargo install --locked zizmor --version 1.32.0
      - name: Verify and install pinned official actionlint binary
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Workflow syntax, local callee contracts and workflow security
        run: |
          cargo test --locked --test workflow_lint -- --include-ignored
          cargo run --locked --bin revayat-scientific -- check-workflows
          zizmor --offline .github/workflows
      - name: Strict native runtime and development dependency audit
        run: cargo audit --deny warnings
  status-final:
    if: ${{ always() && !inputs.prepare_artifacts }}
    needs: [status-pending, security, codeql, dependency-review, portable, scientific, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Publish every validation job outcome and enforce aggregate result
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: cargo run --locked --bin revayat-scientific -- ci-status final
