name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Full base commit SHA for manual dependency and identity review
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  status-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Build status reporter and its required process owner
        run: cargo build --locked -p revayat-scientific --bin revayat-scientific --bin revayat-process-owner
      - name: Publish pending job statuses
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: target/debug/revayat-scientific ci-status pending
  security:
    uses: $/.github/workflows/security-ci.yml
  codeql:
    uses: $/.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
  dependency-review:
    uses: $/.github/workflows/dependency-review.yml
    with:
      base_ref: ${{ inputs.base_ref || github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
  portable:
    name: portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Build every native target
        run: cargo build --locked --workspace --all-targets
      - name: Refresh hosted Linux package inventory
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install hosted Linux Poppler
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install hosted macOS Poppler
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Prepare checksum-pinned hosted Windows Poppler
        if: runner.os == 'Windows'
        run: target/debug/revayat-scientific check-workflows prepare-poppler
      - name: Verify actual Poppler raster readiness
        run: target/debug/revayat-scientific check-workflows poppler-preflight
      - name: Collect every portable debug harness outcome
        run: target/debug/revayat-test-runner --tier portable --profile debug --output execution/portable-debug.json --timeout 1800
      - name: Select and verify the discovered hosted Windows browser
        if: runner.os == 'Windows'
        run: target/debug/revayat-scientific check-workflows select-browser
      - name: Prepare licensed fonts for native Windows renderer
        if: runner.os == 'Windows'
        run: target/debug/revayat-scientific fonts fonts
      - name: Collect required macOS Poppler crop behavior
        if: ${{ always() && !cancelled() && runner.os == 'macOS' }}
        run: target/debug/revayat-test-runner --tier scientific --profile debug --ignored --output execution/scientific-debug.json --timeout 900
      - name: Collect Windows crop and actual rendering preservation
        if: ${{ always() && !cancelled() && runner.os == 'Windows' }}
        env:
          SCIENTIFIC_EVIDENCE_DIR: ${{ runner.temp }}/scientific-evidence
        run: target/debug/revayat-test-runner --tier scientific --profile debug --ignored --output execution/scientific-debug.json --timeout 1200
      - name: Audit all public, upstream and standalone security scenarios
        run: target/debug/revayat-scientific migration-check
      - name: Validate UTF-8, metadata, local links and native skill layout
        run: target/debug/revayat-scientific validate
      - name: Build release executable on every operating system
        if: ${{ always() && !cancelled() }}
        run: cargo build --locked --release --workspace --bins
      - name: Collect every portable release harness outcome
        if: ${{ always() && !cancelled() }}
        run: target/release/revayat-test-runner --tier portable --profile release --output execution/portable-release.json --timeout 1800
      - name: Reclaim checksum-pinned Windows Poppler
        if: ${{ always() && runner.os == 'Windows' }}
        run: target/debug/revayat-scientific check-workflows cleanup-poppler
      - name: Preserve profile-bound execution reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: execution-${{ matrix.os }}
          if-no-files-found: error
          path: execution/*.json
      - name: Package the complete native installed workflow
        run: target/release/revayat-scientific package
      - name: Preserve native release and complete skill archive
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: revayat-scientific-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/revayat-scientific
            target/release/revayat-scientific.exe
            target/release/revayat-process-owner
            target/release/registry-authority.exe
            target/release/revayat-quota-worker.exe
            dist/revayat-scientific.skill
  scientific:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REVAYAT_BROWSER: /usr/bin/google-chrome
      SCIENTIFIC_REQUIRE_TEX_BOUNDARY: '1'
      SCIENTIFIC_REQUIRE_BUILD_GUARD: '1'
      SCIENTIFIC_REQUIRE_BROWSER: '1'
      SCIENTIFIC_REQUIRE_OCR: '1'
      SCIENTIFIC_REQUIRE_SANDBOX: '1'
      SCIENTIFIC_REQUIRE_DOCX_RENDER: '1'
      SCIENTIFIC_REQUIRE_HTML_CONTEXT: '1'
      SCIENTIFIC_RENDER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Refresh native document package inventory
        timeout-minutes: 5
        run: sudo apt-get update
      - name: Install bounded native document toolchain
        timeout-minutes: 20
        run: sudo apt-get install -y --no-install-recommends poppler-utils texlive-xetex texlive-lang-arabic texlive-latex-extra fonts-dejavu-core fonts-vazirmatn libreoffice-writer tesseract-ocr tesseract-ocr-eng tesseract-ocr-fas
      - name: Build native document tools
        run: cargo build --locked --workspace --all-targets
      - name: Select the explicit hosted browser without fallback
        run: target/debug/revayat-scientific check-workflows select-browser
      - name: Verify explicit hosted browser identity and sandboxed readiness
        run: target/debug/revayat-scientific check-workflows browser-preflight
      - name: Install required native workflow regression checker
        run: target/debug/revayat-scientific check-workflows prepare-actionlint
      - name: Prepare licensed Persian font pair
        run: target/debug/revayat-scientific fonts skills/revayat-scientific/assets/fonts
      - name: Build isolated Rust-supervised TeX toolchain
        timeout-minutes: 20
        run: docker build -f skills/revayat-scientific/assets/Dockerfile.tex -t revayat-scientific-tex:1 .
      - name: Collect selected actual rendering, OCR, source and sandbox outcomes
        timeout-minutes: 25
        env:
          SCIENTIFIC_EVIDENCE_DIR: ${{ runner.temp }}/scientific-evidence
        run: target/debug/revayat-test-runner --tier scientific --profile debug --ignored --output execution/scientific-debug.json --timeout 1200
      - name: Preserve scientific execution report even on test failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: execution-scientific-linux
          if-no-files-found: error
          path: execution/*.json
      - name: Verify complete migration inventory with scientific tests registered
        run: target/debug/revayat-scientific migration-check
      - name: Reclaim the verified owned workflow checker
        if: ${{ always() }}
        run: target/debug/revayat-scientific check-workflows cleanup-actionlint
      - name: Preserve rendered verification samples
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scientific-render
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/scientific-evidence
            .scratch/scientific-*
            logs/ci-*.log
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rust-docs
      - name: Build quality tools with the owned Unix process companion
        run: cargo build --locked --workspace --bins
      - name: Check introduced commit identities
        env:
          IDENTITY_BASE: ${{ inputs.base_ref || github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: target/debug/revayat-scientific check-commit-identity --ci-base
      - name: Audit tracked Rust-only sources and comparable size
        run: target/debug/revayat-scientific check-workflows source-audit
      - name: Native formatting checks
        run: cargo fmt --all -- --check
      - name: Native lint checks
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Fetch the complete locked cross-platform dependency graph
        run: cargo fetch --locked
      - name: Verify complete third-party license and copyright notices
        run: target/debug/license-notices --check
      - name: Cache pinned native quality tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/zizmor
          key: native-quality-${{ runner.os }}-audit0.23.0-zizmor1.32.0-actionlint1.7.12
      - name: Install verified pinned dependency and workflow security scanners
        run: target/debug/revayat-scientific --timeout 1800 check-workflows prepare-scanners
      - name: Verify and install pinned official actionlint binary
        run: target/debug/revayat-scientific check-workflows prepare-actionlint
      - name: Workflow regression checks
        run: cargo test --locked --test workflow_lint -- --ignored --test-threads=1
      - name: Workflow syntax and local callee contracts
        run: target/debug/revayat-scientific check-workflows
      - name: Workflow security checks
        run: zizmor --offline .github/workflows
      - name: Strict native runtime and development dependency audit
        run: cargo audit --deny warnings
      - name: Reclaim the verified owned workflow checker
        if: ${{ always() }}
        run: target/debug/revayat-scientific check-workflows cleanup-actionlint
      - name: Preserve bounded prerequisite operation logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-prerequisites
          if-no-files-found: error
          path: |
            logs/ci-*.log
            logs/license-notices_*.log
  behavior-aggregate:
    if: ${{ always() && !cancelled() }}
    needs: [portable, scientific, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Download separate current-run execution reports with digest enforcement
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: execution-*
          path: execution-input
          merge-multiple: false
          digest-mismatch: error
      - name: Build report reconciler and owned process companion
        run: cargo build --locked --workspace --bins
      - name: Require all eleven scopes and full public baseline coverage
        run: target/debug/revayat-test-runner --aggregate --ledger tests/behavior/public-B01.json --ledger tests/behavior/public-B02.json --ledger tests/behavior/public-B03.json --ledger tests/behavior/public-B04.json --ledger tests/behavior/public-B05.json --ledger tests/behavior/public-B06.json --ledger tests/behavior/public-B07.json --ledger tests/behavior/public-B08.json --report execution-input/execution-ubuntu-latest/portable-debug.json --report execution-input/execution-ubuntu-latest/portable-release.json --report execution-input/execution-macos-latest/portable-debug.json --report execution-input/execution-macos-latest/portable-release.json --report execution-input/execution-windows-latest/portable-debug.json --report execution-input/execution-windows-latest/portable-release.json --report execution-input/execution-scientific-linux/scientific-debug.json --report execution-input/execution-macos-latest/scientific-debug.json --report execution-input/execution-windows-latest/scientific-debug.json --report execution-input/execution-native-linux/native-debug.json --report execution-input/execution-native-windows/native-debug.json --event-report execution-input/execution-ubuntu-latest/oracle-debug.json --event-report execution-input/execution-ubuntu-latest/oracle-release.json --event-report execution-input/execution-macos-latest/oracle-debug.json --event-report execution-input/execution-macos-latest/oracle-release.json --event-report execution-input/execution-windows-latest/oracle-debug.json --event-report execution-input/execution-windows-latest/oracle-release.json --event-report execution-input/execution-ubuntu-latest/engine-debug.json --event-report execution-input/execution-ubuntu-latest/runtime-preparation-debug.json --event-report execution-input/execution-ubuntu-latest/engine-release.json --event-report execution-input/execution-ubuntu-latest/runtime-preparation-release.json --event-report execution-input/execution-macos-latest/engine-debug.json --event-report execution-input/execution-macos-latest/runtime-preparation-debug.json --event-report execution-input/execution-macos-latest/engine-release.json --event-report execution-input/execution-macos-latest/runtime-preparation-release.json --event-report execution-input/execution-windows-latest/engine-debug.json --event-report execution-input/execution-windows-latest/runtime-preparation-debug.json --event-report execution-input/execution-windows-latest/engine-release.json --event-report execution-input/execution-windows-latest/runtime-preparation-release.json --event-report execution-input/execution-native-linux/coverage-debug.json --event-report execution-input/execution-native-windows/coverage-debug.json --event-report execution-input/execution-native-windows/native-stage-debug.json
      - name: Require full upstream baseline coverage from the same eleven scopes
        if: ${{ always() }}
        run: target/debug/revayat-test-runner --aggregate --census upstream --ledger tests/behavior/upstream.json --report execution-input/execution-ubuntu-latest/portable-debug.json --report execution-input/execution-ubuntu-latest/portable-release.json --report execution-input/execution-macos-latest/portable-debug.json --report execution-input/execution-macos-latest/portable-release.json --report execution-input/execution-windows-latest/portable-debug.json --report execution-input/execution-windows-latest/portable-release.json --report execution-input/execution-scientific-linux/scientific-debug.json --report execution-input/execution-macos-latest/scientific-debug.json --report execution-input/execution-windows-latest/scientific-debug.json --report execution-input/execution-native-linux/native-debug.json --report execution-input/execution-native-windows/native-debug.json
      - name: Require all fourteen verifier tests from actual reused harness reports
        if: ${{ always() }}
        run: target/debug/revayat-test-runner --aggregate --census verifier --ledger tests/behavior/verifier.json --report execution-input/execution-ubuntu-latest/portable-debug.json --report execution-input/execution-ubuntu-latest/portable-release.json --report execution-input/execution-macos-latest/portable-debug.json --report execution-input/execution-macos-latest/portable-release.json --report execution-input/execution-windows-latest/portable-debug.json --report execution-input/execution-windows-latest/portable-release.json --report execution-input/execution-scientific-linux/scientific-debug.json --report execution-input/execution-macos-latest/scientific-debug.json --report execution-input/execution-windows-latest/scientific-debug.json --report execution-input/execution-native-linux/native-debug.json --report execution-input/execution-native-windows/native-debug.json
      - name: Require every standalone security leaf from actual reused reports
        if: ${{ always() }}
        run: target/debug/revayat-test-runner --aggregate --census security --ledger tests/behavior/security.json --report execution-input/execution-ubuntu-latest/portable-debug.json --report execution-input/execution-ubuntu-latest/portable-release.json --report execution-input/execution-macos-latest/portable-debug.json --report execution-input/execution-macos-latest/portable-release.json --report execution-input/execution-windows-latest/portable-debug.json --report execution-input/execution-windows-latest/portable-release.json --report execution-input/execution-scientific-linux/scientific-debug.json --report execution-input/execution-macos-latest/scientific-debug.json --report execution-input/execution-windows-latest/scientific-debug.json --report execution-input/execution-native-linux/native-debug.json --report execution-input/execution-native-windows/native-debug.json
  status-final:
    if: ${{ always() && !cancelled() }}
    needs: [status-pending, security, codeql, dependency-review, portable, scientific, quality, behavior-aggregate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Build status reporter and its required process owner
        run: cargo build --locked -p revayat-scientific --bin revayat-scientific --bin revayat-process-owner
      - name: Publish every validation job outcome and enforce aggregate result
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: target/debug/revayat-scientific ci-status final
