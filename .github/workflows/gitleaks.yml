name: Gitleaks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  schedule:
    - cron: '56 4 * * 2'

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks secret scan
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Refuse debug logging before checkout can disclose commit contents
        if: runner.debug == '1'
        run: /usr/bin/test 1 = 0

      - name: Check out the complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the native Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Build the native scanner controller and actual Git child adapter
        run: cargo build --locked -p revayat-scientific --bin revayat-scientific --bin revayat-process-owner --bin revayat-gitleaks-git

      - name: Scan Git history with the verified Gitleaks CLI
        run: target/debug/revayat-scientific --timeout 1100 check-workflows gitleaks
