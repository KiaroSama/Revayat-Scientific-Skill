name: Signed native release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v2.0.0
        type: string
permissions:
  contents: read
concurrency:
  group: signed-release-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    name: Archive ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: windows-latest, target: aarch64-pc-windows-msvc }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: ${{ matrix.target }}
      - name: Build host packaging helper
        run: cargo build --locked --release -p revayat-scientific --bin revayat-scientific
      - name: Build host process owner for bounded packaging Git probes
        run: cargo build --locked --release -p revayat-scientific --bin revayat-process-owner
      - name: Build target binaries
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --locked --release -p revayat-scientific --bins
      - name: Package native target archive
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: target/release/revayat-scientific release-bundle stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: release-stage/*.zip
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
          digest-mismatch: error
      - name: Build signing helper and its process owner
        run: cargo build --locked --release -p revayat-scientific --bin revayat-scientific --bin revayat-process-owner
      - name: Sign archives and verify with a clean public keyring
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: target/release/revayat-scientific release-bundle sign
      - name: Attest native archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/revayat-scientific-*.zip
      - name: Publish verified signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: target/release/revayat-scientific release-bundle publish
