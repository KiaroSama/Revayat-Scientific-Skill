name: Dependency review
on:
  workflow_call:
    inputs:
      base_ref:
        description: Full base commit SHA for the reviewed change
        required: true
        type: string
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Build the base resolver and owned process companion
        run: cargo build --locked -p revayat-scientific --bin revayat-scientific --bin revayat-process-owner
      - name: Require an explicit base commit
        id: base
        env:
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: target/debug/revayat-scientific check-sha --ci-base
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate
          base-ref: ${{ steps.base.outputs.sha }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
