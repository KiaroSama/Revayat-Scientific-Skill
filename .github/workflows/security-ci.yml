name: Native security
on:
  workflow_call:
permissions:
  contents: read
jobs:
  linux-security:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SCIENTIFIC_REQUIRE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Build native security owners and probes
        run: cargo build --locked --workspace --all-targets
      - name: Build isolated TeX boundary
        run: docker build -f skills/revayat-scientific/assets/Dockerfile.tex -t revayat-scientific-tex:1 .
      - name: Prove production Linux containment and publication contracts
        run: target/debug/revayat-scientific security-linux
      - name: Collect actual isolated Linux security case outcomes
        if: ${{ always() && !cancelled() }}
        run: target/debug/revayat-test-runner --tier native --profile debug --ignored --output execution/native-debug.json --timeout 1200
      - name: Preserve native Linux outcomes including containment failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: execution-native-linux
          if-no-files-found: error
          path: execution/*.json
  windows-security:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '1'
      RUST_TEST_THREADS: '1'
      RUSTFLAGS: '-D warnings -C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Format native Windows security authority
        run: cargo fmt --all -- --check
      - name: Lint native Windows security authority
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build complete Windows executables before containment tests
        run: cargo build --locked --workspace --all-targets
      - name: Prove native containment before Windows junction and OPC scenarios
        run: target/debug/revayat-scientific security-windows --authority-image target/debug/registry-authority.exe
      - name: Collect actual native Windows harness outcomes
        if: ${{ always() && !cancelled() }}
        run: target/debug/revayat-test-runner --tier native --profile debug --ignored --output execution/native-debug.json --timeout 1200
      - name: Retain independent Rust registry and native contracts
        if: ${{ always() && !cancelled() }}
        run: cargo test --locked --workspace --all-targets -- --test-threads=1
      - name: Preserve native Windows outcomes including case failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: execution-native-windows
          if-no-files-found: error
          path: execution/*.json
