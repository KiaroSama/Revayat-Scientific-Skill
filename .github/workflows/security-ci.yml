name: Native security
on:
  workflow_call:
permissions:
  contents: read
jobs:
  linux-security:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SCIENTIFIC_REQUIRE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Build native security owners and probes
        run: cargo build --locked --workspace --all-targets
      - name: Build isolated TeX boundary
        run: docker build -f skills/revayat-scientific/assets/Dockerfile.tex -t revayat-scientific-tex:1 .
      - name: Prove production Linux containment and publication contracts
        run: cargo run --locked --bin revayat-scientific -- security-linux
  windows-security:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '1'
      RUST_TEST_THREADS: '1'
      RUSTFLAGS: '-D warnings -C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Format and lint native Windows security authority
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build complete Windows executables before containment tests
        run: cargo build --locked --workspace --all-targets
      - name: Prove native containment before Windows junction and OPC scenarios
        run: cargo run --locked --bin revayat-scientific -- security-windows --authority-image target/debug/registry-authority.exe
      - name: Run independent Rust registry oracle and all native security contracts
        run: cargo test --locked --workspace --all-targets -- --test-threads=1
